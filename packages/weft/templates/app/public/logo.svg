<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="weft">
  <style>
    /* A weft crossing a warp: three threads held still, and the weft over once and under once.
       The SVG carries its own palette because an `img` cannot inherit the page's. */
    .warp { fill: #b2b6ca }
    .weft { fill: #796cbf }
    @media (prefers-color-scheme: dark) {
      .warp { fill: #75798c }
      .weft { fill: #9184d9 }
    }
  </style>
  <g class="warp">
    <rect x="4.6" y="2" width="2" height="20" rx="1"/>
    <rect x="11" y="2" width="2" height="20" rx="1"/>
    <rect x="17.4" y="2" width="2" height="20" rx="1"/>
  </g>
  <g class="weft">
    <rect x="1" y="7" width="22" height="2" rx="1"/>
    <rect x="1" y="15" width="3.6" height="2" rx="1"/>
    <rect x="6.6" y="15" width="4.4" height="2" rx="1"/>
    <rect x="13" y="15" width="4.4" height="2" rx="1"/>
    <rect x="19.4" y="15" width="3.6" height="2" rx="1"/>
  </g>
</svg>
